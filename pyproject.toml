[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hfe-character-tool"
version = "0.1.0"
description = "Hero Fighter custom character helper MVP"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "mypy>=1.10",
  "ruff>=0.5",
]
package = [
  "pyinstaller>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.8"
strict = true
mypy_path = "src"

# Vendored byte-for-byte from the hfport porter; validated by byte-exact round trips.
[[tool.mypy.overrides]]
module = "hfe_character_tool.abc_vendor.*"
ignore_errors = true

# These call into the untyped vendored helpers above.
[[tool.mypy.overrides]]
module = [
    "hfe_character_tool.afterimage_patch",
    "hfe_character_tool.donor_textures",
    "test_afterimage_patch",
    "test_donor_textures",
    "afterimage_vm",
]
disallow_untyped_calls = false

# Pillow is optional at runtime (the GUI falls back to flat colors without it).
[[tool.mypy.overrides]]
module = ["PIL", "PIL.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py38"
extend-exclude = ["output/**", "src/hfe_character_tool/abc_vendor/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
